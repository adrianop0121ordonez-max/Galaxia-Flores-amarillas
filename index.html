            function init() {
                const container = document.getElementById('canvas-container');

                scene = new THREE.Scene();

            // Centro Galáctico
            function createGalacticCenter() {
                const bhGeo = new THREE.SphereGeometry(14, 64, 64);
                const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                blackHole = new THREE.Mesh(bhGeo, bhMat);
                scene.add(blackHole);

                const diskGeo = new THREE.RingGeometry(15, 45, 64);
                const diskMat = new THREE.MeshBasicMaterial({
                    color: 0xffcc00,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.88
                });
                accretionDisk = new THREE.Mesh(diskGeo, diskMat);
                accretionDisk.rotation.x = Math.PI / 2;
                scene.add(accretionDisk);
            }

            // Partículas Espirales
            function createGalaxyParticles() {
                const particleCount = 28000;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const colors = new Float32Array(particleCount * 3);

                const colorInside = new THREE.Color(0xfff2a6);
                const colorOutside = new THREE.Color(0xc59b27);

                for (let i = 0; i < particleCount; i++) {
                    const r = Math.pow(Math.random(), 2) * 210 + 16;
                    const arms = 4;
                    const theta = (i % arms) * ((2 * Math.PI) / arms) + r * 0.024 + (Math.random() - 0.5) * 0.55;

                    const x = r * Math.cos(theta);
                    const z = r * Math.sin(theta);
                    const y = (Math.random() - 0.5) * (38 / (r * 0.07 + 1));

                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;

                    const mixedColor = colorInside.clone().lerp(colorOutside, r / 210);
                    colors[i * 3] = mixedColor.r;
                    colors[i * 3 + 1] = mixedColor.g;
                    colors[i * 3 + 2] = mixedColor.b;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const material = new THREE.PointsMaterial({
                    size: 0.95,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.85,
                    blending: THREE.AdditiveBlending
                });

                galaxyParticles = new THREE.Points(geometry, material);
                scene.add(galaxyParticles);
            }

            // Constelación Corazón
            function createGoldenHeart() {
                const heartPoints = [];
                for (let t = 0; t < Math.PI * 2; t += 0.03) {
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    heartPoints.push(new THREE.Vector3(x * 0.95, y * 0.95 + 32, 0));
                }

                const heartGeo = new THREE.BufferGeometry().setFromPoints(heartPoints);
                const heartMat = new THREE.PointsMaterial({ color: 0xffd700, size: 2.0, blending: THREE.AdditiveBlending });
                heartParticles = new THREE.Points(heartGeo, heartMat);
                scene.add(heartParticles);
            }

            // 🌹 ROSA 3D VOLUMÉTRICA COMPLETA
            function create3DRoseMesh() {
                const roseGroup = new THREE.Group();

                const petalMat = new THREE.MeshStandardMaterial({
                    color: 0xffcc00,
                    roughness: 0.3,
                    metalness: 0.1,
                    side: THREE.DoubleSide
                });

                const stemMat = new THREE.MeshStandardMaterial({
                    color: 0x2e8b57,
                    roughness: 0.5
                });

                // Tallo
                const stemGeo = new THREE.CylinderGeometry(0.2, 0.25, 8, 12);
                const stem = new THREE.Mesh(stemGeo, stemMat);
                stem.position.y = -4;
                roseGroup.add(stem);

                // Hojas
                const leafGeo = new THREE.ConeGeometry(0.8, 2.5, 3);
                const leaf1 = new THREE.Mesh(leafGeo, stemMat);
                leaf1.rotation.z = -Math.PI / 3;
                leaf1.position.set(0.8, -3, 0);
                roseGroup.add(leaf1);

                const leaf2 = new THREE.Mesh(leafGeo, stemMat);
                leaf2.rotation.z = Math.PI / 3;
                leaf2.position.set(-0.8, -4.5, 0);
                roseGroup.add(leaf2);

                // Pétalos en Capas
                const layers = [
                    { count: 3, radius: 0.8, scale: 1.0, height: 0.5 },
                    { count: 5, radius: 1.3, scale: 1.4, height: 0.2 },
                    { count: 7, radius: 2.0, scale: 1.8, height: -0.2 },
                    { count: 9, radius: 2.8, scale: 2.2, height: -0.6 }
                ];

                layers.forEach((layer) => {
                    for (let i = 0; i < layer.count; i++) {
                        const angle = (i / layer.count) * Math.PI * 2;
                        const petalGeo = new THREE.SphereGeometry(layer.scale, 16, 16, 0, Math.PI, 0, Math.PI / 2);
                        const petal = new THREE.Mesh(petalGeo, petalMat);

                        petal.position.x = Math.cos(angle) * layer.radius * 0.5;
                        petal.position.z = Math.sin(angle) * layer.radius * 0.5;
                        petal.position.y = layer.height;

                        petal.rotation.y = angle + Math.PI / 2;
                        petal.rotation.x = 0.5;
                        roseGroup.add(petal);
                    }
                });

                const centerGeo = new THREE.SphereGeometry(0.7, 16, 16);
                const centerMat = new THREE.MeshStandardMaterial({ color: 0xff9900 });
                const center = new THREE.Mesh(centerGeo, centerMat);
                center.position.y = 0.4;
                roseGroup.add(center);

                return roseGroup;
            }

            // ⭐ ESTRELLA DORADA EN 3D
            function create3DStarMesh() {
                const starGroup = new THREE.Group();
                const starGeo = new THREE.OctahedronGeometry(2.5, 0);
                const starMat = new THREE.MeshStandardMaterial({
                    color: 0xffea00,
                    emissive: 0xffaa00,
                    emissiveIntensity: 0.5,
                    roughness: 0.2,
                    metalness: 0.8
                });
                const starMesh = new THREE.Mesh(starGeo, starMat);
                starGroup.add(starMesh);
                return starGroup;
            }

            // TEXTURAS CANVAS DE FLORES
            function createSunflowerTex() {
                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d'); ctx.translate(128, 128);
                for (let i = 0; i < 28; i++) {
                    ctx.rotate((Math.PI * 2) / 28);
                    ctx.beginPath(); ctx.ellipse(0, -60, 11, 48, 0, 0, Math.PI * 2);
                    const g = ctx.createLinearGradient(0, -10, 0, -110);
                    g.addColorStop(0, '#ff9900'); g.addColorStop(0.5, '#ffd700'); g.addColorStop(1, '#fff5cc');
                    ctx.fillStyle = g; ctx.fill();
                }
                ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI * 2);
                const cg = ctx.createRadialGradient(0, 0, 4, 0, 0, 32);
                cg.addColorStop(0, '#221100'); cg.addColorStop(0.8, '#5c3300'); cg.addColorStop(1, '#8b5a2b');
                ctx.fillStyle = cg; ctx.fill();
                return new THREE.CanvasTexture(canvas);
            }

            function createTulipTex() {
                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d'); ctx.translate(128, 128);
                ctx.beginPath(); ctx.ellipse(0, 10, 30, 65, 0, 0, Math.PI * 2);
                const g = ctx.createLinearGradient(0, 70, 0, -50);
                g.addColorStop(0, '#e6b800'); g.addColorStop(0.6, '#ffd700'); g.addColorStop(1, '#fffae6');
                ctx.fillStyle = g; ctx.fill();
                return new THREE.CanvasTexture(canvas);
            }

            function createDaisyTex() {
                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d'); ctx.translate(128, 128);
                for (let i = 0; i < 20; i++) {
                    ctx.rotate((Math.PI * 2) / 20);
                    ctx.beginPath(); ctx.ellipse(0, -50, 7, 40, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffeb99'; ctx.fill();
                }
                ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2);
                ctx.fillStyle = '#ffaa00'; ctx.fill();
                return new THREE.CanvasTexture(canvas);
            }

            function createOrchidTex() {
                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d'); ctx.translate(128, 128);
                for (let i = 0; i < 5; i++) {
                    ctx.rotate((Math.PI * 2) / 5);
                    ctx.beginPath(); ctx.ellipse(0, -45, 18, 45, 0, 0, Math.PI * 2);
                    const g = ctx.createRadialGradient(0, -45, 5, 0, -45, 45);
                    g.addColorStop(0, '#fff5cc'); g.addColorStop(0.7, '#ffd700'); g.addColorStop(1, '#cc9900');
                    ctx.fillStyle = g; ctx.fill();
                }
                ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.fillStyle = '#ff8800'; ctx.fill();
                return new THREE.CanvasTexture(canvas);
            }

            function createTextTexture(text) {
                const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0, 0, 512, 128);
                ctx.font = 'Bold 28px "Cinzel", serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 12; ctx.fillStyle = '#ffffff';
                ctx.fillText(text, 256, 64);
                return new THREE.CanvasTexture(canvas);
            }

            // Llenar la galaxia con abundancia total de objetos
            function populateGalacticGarden() {
                const sunflowerTex = createSunflowerTex();
                const tulipTex = createTulipTex();
                const daisyTex = createDaisyTex();
                const orchidTex = createOrchidTex();

                const spriteTextures = [sunflowerTex, tulipTex, daisyTex, orchidTex];
                const totalFrases = FRASES.length;

                // Se crean 120 posiciones en total repartidas en los 4 brazos espirales
                const totalObjects = 120;

                for (let i = 0; i < totalObjects; i++) {
                    const r = 25 + Math.random() * 165;
                    const theta = (i / totalObjects) * Math.PI * 12 + (Math.random() - 0.5) * 0.45;

                    const x = r * Math.cos(theta);
                    const z = r * Math.sin(theta);
                    const y = (Math.random() - 0.5) * 22;

                    const frase = FRASES[i % totalFrases];
                    const typeChoice = i % 4;

                    if (typeChoice === 0) {
                        // ROSA 3D
                        const rose3D = create3DRoseMesh();
                        rose3D.position.set(x, y, z);
                        rose3D.scale.set(1.3, 1.3, 1.3);
                        rose3D.rotation.x = Math.random() * Math.PI;
                        rose3D.userData = { type: 'rose3d', frase: frase };

                        rose3D.traverse((child) => {
                            if (child.isMesh) {
                                child.userData = { parentGroup: rose3D, frase: frase };
                                interactiveObjects.push(child);
                            }
                        });

                        scene.add(rose3D);
                        rotating3DObjects.push(rose3D);

                    } else if (typeChoice === 1) {
                        // ESTRELLA 3D
                        const star3D = create3DStarMesh();
                        star3D.position.set(x, y, z);
                        star3D.userData = { type: 'star3d', frase: frase };

                        star3D.traverse((child) => {
                            if (child.isMesh) {
                                child.userData = { parentGroup: star3D, frase: frase };
                                interactiveObjects.push(child);
                            }
                        });

                        scene.add(star3D);
                        rotating3DObjects.push(star3D);

                    } else {
                        // SPRITES DE FLORES (Girasoles, Orquídeas, Margaritas, Tulipanes)
                        const selectedTex = spriteTextures[i % spriteTextures.length];
                        const flowerMat = new THREE.SpriteMaterial({ map: selectedTex, transparent: true });
                        const flowerSprite = new THREE.Sprite(flowerMat);
                        flowerSprite.position.set(x, y, z);
                        flowerSprite.scale.set(13, 13, 1);
                        flowerSprite.userData = { type: 'flower', frase: frase };
                        scene.add(flowerSprite);
                        interactiveObjects.push(flowerSprite);
                    }

                    // Etiqueta de Texto Flotante en 3D
                    if (i % 2 === 0) {
                        const textTex = createTextTexture(frase);
                        const textMat = new THREE.SpriteMaterial({ map: textTex, transparent: true });
                        const textSprite = new THREE.Sprite(textMat);
                        textSprite.position.set(x, y - 7, z);
                        textSprite.scale.set(22, 5.5, 1);
                        textSprite.userData = { type: 'text', frase: frase };
                        scene.add(textSprite);
                        interactiveObjects.push(textSprite);
                    }
                }
            }

            function animate() {
                requestAnimationFrame(animate);
                TWEEN.update();

                if (galaxyParticles) galaxyParticles.rotation.y += 0.0004;
                if (accretionDisk) accretionDisk.rotation.z += 0.002;
                if (heartParticles) heartParticles.rotation.y += 0.004;

                // Rotación suave de rosas y estrellas 3D
                rotating3DObjects.forEach(obj => {
                    obj.rotation.y += 0.008;
                });

                controls.update();
                renderer.render(scene, camera);
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            function onDocumentClick(event) {
                if (modal.classList.contains('pointer-events-auto')) return;

                const raycaster = new THREE.Raycaster();
                const mouse = new THREE.Vector2();
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactiveObjects);

                if (intersects.length > 0) {
                    const hit = intersects[0].object;
                    const fraseText = hit.userData.frase || (hit.userData.parentGroup && hit.userData.parentGroup.userData.frase);

                    if (fraseText) {
                        const worldPos = new THREE.Vector3();
                        hit.getWorldPosition(worldPos);
                        openFraseModal(fraseText, worldPos);
                    }
                }
            }

            function openFraseModal(fraseText, targetPos) {
                modalTitle.innerText = "Mensaje de Luz ✨";
                modalBody.innerText = `"${fraseText}"`;

                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.classList.add('opacity-100', 'pointer-events-auto');
                modalCard.classList.remove('scale-95');
                modalCard.classList.add('scale-100');

                new TWEEN.Tween(camera.position)
                    .to({ x: targetPos.x * 1.25, y: targetPos.y + 12, z: targetPos.z * 1.25 }, 1400)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();

                new TWEEN.Tween(controls.target)
                    .to({ x: targetPos.x, y: targetPos.y, z: targetPos.z }, 1400)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();
            }

            function hideModal() {
                modal.classList.remove('opacity-100', 'pointer-events-auto');
                modal.classList.add('opacity-0', 'pointer-events-none');
                modalCard.classList.remove('scale-100');
                modalCard.classList.add('scale-95');
            }

            function setupUIEvents() {
                closeModal.addEventListener('click', hideModal);
                modalOkBtn.addEventListener('click', hideModal);

                audioBtn.addEventListener('click', () => {
                    if (bgMusic.paused) {
                        bgMusic.play().then(() => {
                            audioIcon.className = "fas fa-pause text-base";
                        }).catch(err => {
                            alert("Asegúrate de colocar tu canción en la carpeta wwwroot con el nombre 'cancion.mp3'.");
                        });
                    } else {
                        bgMusic.pause();
                        audioIcon.className = "fas fa-music text-base";
                    }
                });

                autoRotateBtn.addEventListener('click', () => {
                    autoRotate = !autoRotate;
                    controls.autoRotate = autoRotate;
                    autoRotateBtn.classList.toggle('bg-amber-500/30');
                });

                resetCamBtn.addEventListener('click', () => {
                    new TWEEN.Tween(camera.position)
                        .to({ x: 0, y: 130, z: 230 }, 1500)
                        .easing(TWEEN.Easing.Cubic.Out)
                        .start();

                    new TWEEN.Tween(controls.target)
                        .to({ x: 0, y: 0, z: 0 }, 1500)
                        .easing(TWEEN.Easing.Cubic.Out)
                        .start();
                });
            }
    </script>
</body>
</html>
